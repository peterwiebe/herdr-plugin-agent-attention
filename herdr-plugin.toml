id = "agent-attention"
name = "Agent Attention"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Cycle through blocked and finished-unseen agents by view history."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "goto"
title = "Cycle to next agent needing attention"
contexts = ["workspace", "pane"]
command = ["bash", "bin/goto.sh"]

[[events]]
on = "pane.focused"
command = ["python3", "lib/cycle.py", "record-focus"]

[[actions]]
id = "apply-view"
title = "Sort Agents panel by attention"
contexts = ["workspace", "pane"]
command = ["python3", "lib/view.py", "set"]

[[actions]]
id = "clear-view"
title = "Reset Agents panel sort"
contexts = ["workspace", "pane"]
command = ["python3", "lib/view.py", "clear"]

[[startup]]
command = ["python3", "lib/view.py", "restore"]
